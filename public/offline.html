<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#059669">
    <title>Sem conexão</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; background: #f9fafb; color: #111827; text-align: center; padding: 24px; }
        main { max-width: 22rem; }
        h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
        p { color: #4b5563; line-height: 1.5; }
        button { margin-top: 1rem; padding: .75rem 1.5rem; border: 0; border-radius: .5rem; background: #059669; color: #fff; font-size: 1rem; }
    </style>
</head>
<body>
    <main>
        <h1>Sem conexão</h1>
        <p>O app precisa de internet para salvar placar e súmula. O que já foi lançado está salvo no servidor. Volte a ter sinal e tente de novo.</p>
        <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
</body>
</html>
