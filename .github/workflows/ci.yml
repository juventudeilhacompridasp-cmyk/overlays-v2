name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php:
    name: PHP (lint, análise estática, testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, pcntl, posix, bcmath, gd, exif, zip
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Pint
        run: vendor/bin/pint --test
      - name: Larastan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - name: Pest
        run: php artisan test

  frontend:
    name: Front (tipos e build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pcntl, posix
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: npm ci
      - name: Projeção da fila offline da súmula (Node)
        run: npm run test:js
      - run: npm run build

  realtime:
    name: Tempo real e push (Reverb e Web Push de verdade)
    runs-on: ubuntu-latest
    env:
      RUN_E2E: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, pcntl, posix, bcmath, gd, exif, zip, curl, openssl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: npm ci
      - run: cp .env.example .env && php artisan key:generate
      # Sobe um Reverb real e um cliente WebSocket (pusher-js, em Node); manda um Web Push real para um receptor que
      # confere a assinatura VAPID e decifra o corpo (ver tests/Feature/Realtime e tests/e2e).
      - name: Reverb e Web Push de ponta a ponta
        run: php artisan test --filter=EndToEnd

  offline:
    name: Fila offline no navegador (Chromium)
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/e2e.sqlite
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: 'null'
      INERTIA_SSR_ENABLED: 'false'
      APP_ENV: local
      APP_DEBUG: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, pcntl, posix, bcmath, gd, exif, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: npm ci
      - run: cp .env.example .env && php artisan key:generate
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - name: Banco e dados de teste
        run: |
          touch "$DB_DATABASE"
          php artisan migrate --force
          php tests/e2e/seed-sheet.php > seed.json
      - name: Servidor e teste de navegador
        run: |
          PHP_CLI_SERVER_WORKERS=4 php artisan serve --host=127.0.0.1 --port=8000 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/login > /dev/null && break; sleep 1; done
          node tests/e2e/offline-queue.mjs http://127.0.0.1:8000 "$(cat seed.json)" || { echo '--- server.log'; grep -v '/build/' server.log | tail -40; echo '--- laravel.log'; tail -40 storage/logs/laravel.log || true; exit 1; }
      - name: Guardar evidências se falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: offline-queue-falha
          path: |
            offline-queue-falha.png
            server.log
            storage/logs/*.log
          if-no-files-found: ignore

  docker:
    name: Imagens Docker
    runs-on: ubuntu-latest
    needs: [php, frontend, realtime, offline]
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_PREFIX: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login no GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: app (php-fpm / horizon / reverb / ssr)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/app:main
            ${{ env.IMAGE_PREFIX }}/app:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: nginx
        uses: docker/build-push-action@v6
        with:
          context: .
          target: nginx
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/nginx:main
            ${{ env.IMAGE_PREFIX }}/nginx:${{ github.sha }}
          cache-from: type=gha,scope=app
      - name: backup
        uses: docker/build-push-action@v6
        with:
          context: docker/backup
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/backup:main
            ${{ env.IMAGE_PREFIX }}/backup:${{ github.sha }}
