# Ambiente LOCAL. Uso: `make setup` na primeira vez e `make up` depois.
# Portas: app 8080 | Reverb 8081 | Vite 5173 | Mailpit 8025 | S3 local 9000 | Postgres 5433

x-app: &app
  build:
    context: .
    target: dev
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: overlays-app-dev
  environment:
    COMPOSER_PROCESS_TIMEOUT: "0"
    COMPOSER_MEMORY_LIMIT: "-1"
  volumes:
    - .:/var/www/html
    # vendor fica em volume do Docker (rápido, principalmente no Windows/Mac); não aparece na pasta do projeto.
    - vendor:/var/www/html/vendor
  depends_on:
    init: { condition: service_completed_successfully }
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  # Ajusta a dono dos volumes de dependências para o seu usuário (executa e termina).
  init:
    image: alpine:3.21
    user: root
    restart: "no"
    command: >
      sh -c "for d in /mnt/vendor /mnt/node_modules; do
      [ \"$$(stat -c %u $$d)\" = \"${UID:-1000}\" ] || chown -R ${UID:-1000}:${GID:-1000} $$d; done"
    volumes:
      - vendor:/mnt/vendor
      - node_modules:/mnt/node_modules

  app:
    <<: *app
    command: php-fpm

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www/html:ro
    depends_on: [app]

  horizon:
    <<: *app
    command: php artisan horizon
    restart: unless-stopped

  scheduler:
    <<: *app
    command: php artisan schedule:work
    restart: unless-stopped

  reverb:
    <<: *app
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "${REVERB_PUBLIC_PORT:-8081}:8080"
    restart: unless-stopped

  vite:
    image: node:22-alpine
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html
    depends_on:
      init: { condition: service_completed_successfully }
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    environment:
      HOME: /tmp

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-overlays}
      POSTGRES_USER: ${DB_USERNAME:-overlays}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PUBLIC_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-overlays} -d ${DB_DATABASE:-overlays}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3 local (Adobe S3Mock): compatível com a API do S3, cria os buckets sozinho. Sem painel web.
  s3:
    image: adobe/s3mock:5
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: overlays-public,overlays-private
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3data
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "9000:9090"
    volumes:
      - s3data:/s3data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  vendor:
  node_modules:
  pgdata:
  redisdata:
  s3data:
